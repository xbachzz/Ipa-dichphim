name: TranslateDubApp
options:
  bundleIdPrefix: com.videotranslator
  projectFormat: xcode15_0
  xcodeVersion: "15.4"
targets:
  TranslateDubApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_NAME: "TranslateDubApp"
        PRODUCT_BUNDLE_IDENTIFIER: "com.videotranslator.TranslateDubApp"
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: "Info.plist"
        CODE_SIGN_STYLE: "Manual"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "YES"
        AD_HOC_CODE_SIGNING_ALLOWED: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: "Dịch & Lồng Tiếng AI"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchStoryboardName: "LaunchScreen"
        NSPhotoLibraryUsageDescription: "Ứng dụng cần quyền chọn video từ thư viện."
        NSPhotoLibraryAddUsageDescription: "Ứng dụng cần quyền lưu video sau khi dịch vào Photos."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsArbitraryLoadsInWebContent: true
          NSAllowsLocalNetworking: true
