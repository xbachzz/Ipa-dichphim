name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Application (.app)
        run: |
          xcodebuild build \
            -project TranslateDubApp.xcodeproj \
            -scheme TranslateDubApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES

      - name: Package to IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          
          # Thực hiện Ad-Hoc Code Signing đảm bảo binary có LC_CODE_SIGNATURE và thư mục _CodeSignature
          codesign --force --deep --sign - "Payload/TranslateDubApp.app"
          
          # Xác thực tính toàn vẹn chữ ký Ad-Hoc
          codesign -dvvv "Payload/TranslateDubApp.app"
          
          # Đóng gói chuẩn IPA với cờ -qry bảo lưu symbolic links và permissions
          zip -qry TranslateDubApp.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TranslateDubApp-IPA
          path: TranslateDubApp.ipa
          retention-days: 7
