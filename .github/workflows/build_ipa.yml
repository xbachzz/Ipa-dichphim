name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Application (.app)
        run: |
          xcodebuild build \
            -project TranslateDubApp.xcodeproj \
            -scheme TranslateDubApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES

      - name: Package to IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          
          # Đảm bảo Info.plist có đầy đủ ATS (cho phép HTTP) và LaunchScreen (tránh khoảng trống đen)
          python3 -c "
          import plistlib
          plist_path = 'Payload/TranslateDubApp.app/Info.plist'
          with open(plist_path, 'rb') as f:
              pl = plistlib.load(f)

          # Cấu hình App Transport Security cho phép kết nối HTTP VPS
          pl['NSAppTransportSecurity'] = {
              'NSAllowsArbitraryLoads': True,
              'NSAllowsArbitraryLoadsInWebContent': True,
              'NSAllowsLocalNetworking': True,
              'NSExceptionDomains': {
                  '103.211.206.176': {
                      'NSIncludesSubdomains': True,
                      'NSTemporaryExceptionAllowsInsecureHTTPLoads': True,
                      'NSTemporaryExceptionMinimumTLSVersion': 'TLSv1.0'
                  }
              }
          }

          # Cấu hình toàn màn hình tránh viền đen trên dưới (Letterboxing)
          pl['UILaunchStoryboardName'] = 'LaunchScreen'
          pl['UILaunchScreen'] = {'UIColorName': '', 'UIImageRespectsSafeAreaInsets': True}

          with open(plist_path, 'wb') as f:
              plistlib.dump(pl, f)
          print('>>> Info.plist verified & patched with ATS & LaunchScreen')
          "
          
          # Ký Ad-Hoc cho app bundle với LC_CODE_SIGNATURE hợp lệ
          codesign --force --deep --sign - "Payload/TranslateDubApp.app"
          
          # Kiểm tra chữ ký
          codesign -dvvv "Payload/TranslateDubApp.app"
          
          # Đóng gói chuẩn IPA (-qry giữ symbolic links và file permissions)
          zip -qry TranslateDubApp.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TranslateDubApp-IPA
          path: TranslateDubApp.ipa
          retention-days: 7
